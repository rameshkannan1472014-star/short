<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Short Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <header class="top">
      <div class="brand"><span class="brand-mark">÷</span><span>SHORT <small>CALCULATOR</small></span></div>
      <span class="status">READY</span>
    </header>
    <section class="screen" aria-live="polite">
      <div id="expression" class="expression">0</div>
      <div id="display" class="display">0</div>
    </section>
    <section class="keys" aria-label="Calculator keys">
      <button class="key utility" data-action="clear">AC</button>
      <button class="key utility" data-action="sign">±</button>
      <button class="key utility" data-action="percent">%</button>
      <button class="key operator" data-op="÷">÷</button>
      <button class="key" data-digit="7">7</button>
      <button class="key" data-digit="8">8</button>
      <button class="key" data-digit="9">9</button>
      <button class="key operator" data-op="×">×</button>
      <button class="key" data-digit="4">4</button>
      <button class="key" data-digit="5">5</button>
      <button class="key" data-digit="6">6</button>
      <button class="key operator" data-op="−">−</button>
      <button class="key" data-digit="1">1</button>
      <button class="key" data-digit="2">2</button>
      <button class="key" data-digit="3">3</button>
      <button class="key operator" data-op="+">+</button>
      <button class="key utility" data-action="backspace" aria-label="Backspace">⌫</button>
      <button class="key" data-digit="0">0</button>
      <button class="key" data-action="decimal">.</button>
      <button class="key equals" data-action="equals">=</button>
    </section>
    <footer>Simple · Fast · Works offline</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
